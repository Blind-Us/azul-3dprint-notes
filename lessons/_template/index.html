  不要改：五個區塊的順序和 id、CSS/JS 引用、頁首頁尾結構。
-->
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>★ 問句標題｜A竹 3D列印入門</title>
  <meta name="description" content="★ 與 lessons.js summary 相同的一句話">
  <meta name="theme-color" content="#315E43">
  <link rel="icon" href="../../assets/img/favicon.png">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body data-lesson="NN-slug"><!-- ★ 改成 slug -->
  <a class="skip-link" href="#main">跳到主要內容</a>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../../"><img src="../../assets/img/logo.png" alt="" width="40" height="40"><span>A竹 3D列印入門<small>A竹's 3D列印實驗室</small></span></a>
      <nav class="site-nav" aria-label="主要導覽">
        <a href="../../#lessons">所有講義</a>
        <a href="../../#how">怎麼做的</a>
        <a href="https://blind-us.github.io/azul-3dlab/" rel="noopener">作品與客製</a>
      </nav>
    </div>
  </header>

  <main id="main" class="container lesson">
    <!-- 1. 頁首：問句標題＋一句話答案 -->
    <header class="lesson-hero">
      <p class="breadcrumb"><a href="../../">首頁</a> ／ <span data-lesson-no></span></p>
      <h1>★ 問句標題</h1>
      <p class="lesson-lead">★ 一句話先講答案（40 字內）</p>
    </header>

    <!-- 2. 一張圖看懂：左邊 3–5 個短步驟，右邊一個互動元件或圖 -->
    <section id="idea" class="split">
      <div class="split-text">
        <h2>★ 小標題</h2>
        <ol class="steps" id="idea-steps">
          <li><strong>★ 兩到四個字</strong>★ 一句話說明</li>
        </ol>
      </div>
      <div class="split-visual">
        <div class="widget" data-widget="★">
          <p class="widget-title">★ 元件標題</p>
        </div>
      </div>
    </section>

    <!-- 3. 重點：2–4 張卡片，或一張比較表 -->
    <section id="points">
      <h2>★ 三個重點</h2>
      <div class="cards">
        <article class="card">
          <p class="card-icon" aria-hidden="true">★</p>
          <h3>★ 重點</h3>
          <p>★ 兩行以內</p>
        </article>
      </div>
    </section>

    <!-- 4. 考考你：剛好一題 -->
    <section id="quiz">
      <h2>考考你</h2>
      <div class="quiz" data-widget="quiz">
        <p class="quiz-q">★ 題目</p>
        <div class="quiz-options">
          <button type="button" data-correct>★ 正確答案</button>
          <button type="button">★ 錯誤答案</button>
        </div>
        <p class="quiz-explain" hidden>★ 一句話解說</p>
      </div>
    </section>

    <!-- 5. 資料來源：摺起來，不打斷閱讀 -->
    <section id="sources">
      <details class="sources">
        <summary>資料來源</summary>
        <ul>
          <li>★ 用在哪句話：<a href="https://example.com" rel="noopener">來源名稱</a>（擷取日期）</li>
        </ul>
      </details>
    </section>

    <nav class="lesson-pager" data-pager aria-label="上一頁與下一頁"></nav>
  </main>

  <footer class="site-footer">

    </div>
  </footer>
  <script src="../../assets/js/lessons.js"></script>
  <script src="../../assets/js/site.js"></script>
